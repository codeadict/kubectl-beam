apiVersion: v1
kind: Pod
metadata:
  name: erlang-app-name
  labels:
    app: erlang-app
    variant: name
spec:
  containers:
  - name: erlang-app
    image: erlang-app:test
    imagePullPolicy: Never
    env:
    - name: RELX_REPLACE_OS_VARS
      value: "true"
    - name: RELEASE_COOKIE
      value: "test_cookie_secret"
    - name: NODE_NAME
      value: "erlang_app"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: VMARGS_PATH
      value: "/app/releases/0.1.0/vm.args.name"
    command: ["/app/bin/erlang_app"]
    args: ["foreground"]
